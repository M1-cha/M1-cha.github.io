black-hole-vortex .7s ease-out forwards}

crosshair:after{width:40px;height:2px;top:12px;left:-7px}

<header id="topbar"><div id="controls" aria-label="Spielsteuerung"><button id="pause" disabled>STOPP</button><button id="resume" disabled>WEITER</button></div><div id="worlds" aria-label="Welten-Auswahl"><h2>WELTEN</h2><div class="world-grid"><button class="world-button active" data-world="one">WELT 1</button><button class="world-button" data-world="two">WELT 2</button><button class="world-button" data-world="three">WELT 3</button><button class="world-button" data-world="four">WELT 4</button><button class="world-button" data-world="five">WELT 5</button><button class="world-button" data-world="six">WELT 6</button><button class="world-button" data-world="seven">WELT 7</button><button class="world-button" data-world="eight">WELT 8</button><button class="world-button" data-world="nine">WELT 9</button></div></div><div id="hud"><div class="pill">PUNKTE: <span id="score">0</span></div><div class="pill">ZEIT: <span id="time">45</span>s</div><div class="pill">2×: <span id="bonus">—</span></div></div><aside id="leaderboard-panel" aria-label="Bestenliste"><h2>TOP 10 · PUNKTE</h2><ol id="live-scores"></ol></aside></header>
<main id="game" aria-label="Galaxy of the Monsters"><aside id="shop" aria-label="Monster-Shop"><h2>MONSTER-SHOP</h2><div class="shop-item active" data-type="classic"><button class="choose"><span class="shop-icon" style="--c:#ff8cb0">👾</span><span>Klassiker<small>Ausgewogen</small></span></button><span class="owned">KOSTENLOS</span></div><div class="shop-item" data-type="ufo"><button class="choose"><span class="shop-icon" style="--c:#8df7ff">🛸</span><span>UFO-Monster<small>Im Raumschiff</small></span></button><button class="unlock">150 P.</button></div><div class="shop-item" data-type="orb"><button class="choose"><span class="shop-icon" style="--c:#ffe37d">●</span><span>Rundling<small>Sehr schnell</small></span></button><button class="unlock">275 P.</button></div><div class="shop-item" data-type="alien"><button class="choose"><span class="shop-icon" style="--c:#a5ff91">👽</span><span>Zack-Marsianer<small>Ruckartig</small></span></button><button class="unlock">400 P.</button></div></aside><div id="crosshair"></div><section id="start"><div id="card"></div></section></main>
<script>
const game=document.querySelector('#game'),scoreEl=document.querySelector('#score'),timeEl=document.querySelector('#time'),bonusEl=document.querySelector('#bonus'),start=document.querySelector('#start'),card=document.querySelector('#card'),crosshair=document.querySelector('#crosshair'),pauseButton=document.querySelector('#pause'),resumeButton=document.querySelector('#resume'),colors=['#ff6b91','#77d8ff','#9af27a','#ffbd59','#bd8cff'],key='galaxy-monsters-players',costs={classic:0,ufo:150,orb:275,alien:400},worldOrder=['one','two','three','four','five','six','seven','eight','nine'],worldNames={one:'Planeten',two:'Galaxie',three:'Jupiter Galaxy',four:'Mond',five:'Mars',six:'Jupiter',seven:'Uranus',eight:'Saturn',nine:'Erde'};let score=0,seconds=45,running=false,paused=false,bossSpawned=false,bossDefeated=false,timer,spawner,powerSpawner,meteorSpawner,bonusTimer,musicTimer,musicIndex=0,doubleUntil=0,audio,selected='classic',roundType='classic',world='one',player='';
const esc=v=>v.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function worldWave(){const wave=document.createElement('div');wave.className='world-wave';game.append(wave);setTimeout(()=>wave.remove(),850)}function setWorld(nextWorld){if(running&&nextWorld!==world)return;world=nextWorld;game.classList.toggle('world-two',world==='two');game.classList.toggle('world-three',world==='three');game.classList.toggle('world-four',world==='four');game.classList.toggle('world-five',world==='five');game.classList.toggle('world-six',world==='six');game.classList.toggle('world-seven',world==='seven');game.classList.toggle('world-eight',world==='eight');game.classList.toggle('world-nine',world==='nine');worldWave();updateWorlds()}
function players(){try{return JSON.parse(localStorage.getItem(key))||[]}catch{return[]}}function save(name,points){const all=players(),id=name.toLocaleLowerCase();let p=all.find(x=>x.id===id);if(p){p.points+=points;p.best=Math.max(p.best,points);p.name=name;p.unlocks??=['classic'];p.worlds??=['one']}else{p={id,name,points,best:points,unlocks:['classic'],worlds:['one']};all.push(p)}all.sort((a,b)=>b.points-a.points);localStorage.setItem(key,JSON.stringify(all));refreshLeaderboard();return all}function list(all=players()){return all.length?all.slice(0,10).map(x=>'<li><span>'+esc(x.name)+'</span><b>'+x.points+'</b></li>').join(''):'<li class="empty">Noch keine Plopp-Helden.</li>'}function refreshLeaderboard(){const board=document.querySelector('#live-scores');if(board)board.innerHTML=list()}
function current(){return player&&players().find(x=>x.id===player.toLocaleLowerCase())}function unlocked(type){return type==='classic'||!!current()?.unlocks?.includes(type)}function worldCost(type){return 0}function worldUnlocked(type){return true}function updateWorlds(){document.querySelectorAll('.world-button').forEach(button=>{const type=button.dataset.world,index=worldOrder.indexOf(type),open=worldUnlocked(type);button.disabled=running;button.classList.toggle('active',open&&type===world);button.classList.toggle('locked',!open);button.innerHTML=(worldNames[type]||'WELT '+(index+1))+'<small>'+(open?'FREI':worldCost(type)+' P.')+'</small>'})}function buyWorld(type){if(!player){alert('Gib zuerst deinen Spielernamen ein und sammle Punkte.');return}const all=players(),id=player.toLocaleLowerCase(),p=all.find(x=>x.id===id);if(!p){alert('Spiele zuerst eine Runde, um Punkte zu sammeln.');return}if(p.worlds?.includes(type)){setWorld(type);return}const price=worldCost(type);if(p.points<price){alert('Dir fehlen noch '+(price-p.points)+' Punkte für diese Welt.');return}p.points-=price;p.worlds??=['one'];p.worlds.push(type);all.sort((a,b)=>b.points-a.points);localStorage.setItem(key,JSON.stringify(all));const board=card.querySelector('ol');if(board)board.innerHTML=list(all);setWorld(type)}function updateControls(){game.classList.toggle('paused',paused);pauseButton.disabled=!running||paused;resumeButton.disabled=!running||!paused}function updateShop(){document.querySelectorAll('.shop-item').forEach(item=>{const type=item.dataset.type,open=unlocked(type),choose=item.querySelector('.choose'),buy=item.querySelector('.unlock');item.classList.toggle('active',type===selected);choose.disabled=!open||running;if(buy){buy.disabled=open||running;buy.textContent=open?'FREI':' '+costs[type]+' P.'}})}function buy(type){const all=players(),id=player.toLocaleLowerCase(),p=all.find(x=>x.id===id);if(!player||!p){alert('Spiele zuerst eine Runde mit deinem Spielernamen, um Punkte zu sammeln.');return}if(p.unlocks?.includes(type))return;if(p.points<costs[type]){alert('Dir fehlen noch '+(costs[type]-p.points)+' Punkte.');return}p.points-=costs[type];p.unlocks??=['classic'];p.unlocks.push(type);all.sort((a,b)=>b.points-a.points);localStorage.setItem(key,JSON.stringify(all));const board=card.querySelector('ol');if(board)board.innerHTML=list(all);selected=type;updateShop()}
function showStart(){card.innerHTML='<h1>Galaxy and<br>Monsters!</h1><p>Wähle links ein Monster aus und sammle Punkte für deinen Spieler.</p><form id="player-form"><input id="player" maxlength="16" required placeholder="Dein Spielername" aria-label="Dein Spielername"><button>SPIEL STARTEN</button></form><div class="leaderboard"><h2>TOP 10 · GESAMTPUNKTE</h2><ol>'+list()+'</ol></div>';const input=document.querySelector('#player');input.addEventListener('input',()=>{player=input.value.trim();updateShop();updateWorlds()});document.querySelector('#player-form').addEventListener('submit',e=>{e.preventDefault();player=input.value.trim();if(player)begin()});updateShop();updateWorlds()}
function laser(){audio??=new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();const t=audio.currentTime,o=audio.createOscillator(),g=audio.createGain();o.type='sawtooth';o.frequency.setValueAtTime(1100,t);o.frequency.exponentialRampToValueAtTime(130,t+.2);g.gain.setValueAtTime(.12,t);g.gain.exponentialRampToValueAtTime(.001,t+.22);o.connect(g).connect(audio.destination);o.start(t);o.stop(t+.23)}function musicTone(frequency,time,length,volume,type='sine'){const o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.setValueAtTime(frequency,time);g.gain.setValueAtTime(.001,time);g.gain.exponentialRampToValueAtTime(volume,time+.08);g.gain.exponentialRampToValueAtTime(.001,time+length);o.connect(g).connect(audio.destination);o.start(time);o.stop(time+length+.03)}function playMusic(){if(!running||paused)return;audio??=new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();const pattern=[220,261.63,293.66,329.63,293.66,261.63],root=pattern[musicIndex%pattern.length],t=audio.currentTime+.04;musicTone(root/2,t,1.45,.025,'sine');musicTone(root,t+.12,.72,.035,'triangle');musicTone(root*1.5,t+.52,.52,.018,'sine');if(musicIndex%2===0)musicTone(root*2,t+.9,.26,.012,'sine');musicIndex++}function startMusic(){clearInterval(musicTimer);musicIndex=0;playMusic();musicTimer=setInterval(playMusic,1500)}function stopMusic(){clearInterval(musicTimer)}
function maybeSpawnBoss(){if(score>=75&&!bossSpawned){bossSpawned=true;const boss=document.createElement('div');let hp=30;boss.className='boss';boss.style.left=Math.max(15,(game.clientWidth-185)/2)+'px';boss.style.top=Math.max(75,(game.clientHeight-155)/2)+'px';boss.innerHTML='<span class="boss-hp">30</span><i class="boss-eye one"></i><i class="boss-eye two"></i><i class="boss-mouth"></i>';game.append(boss);boss.addEventListener('pointerdown',e=>{if(paused||bossDefeated)return;e.stopPropagation();hp--;boss.querySelector('.boss-hp').textContent=hp;boss.classList.add('hit');setTimeout(()=>boss.classList.remove('hit'),90);if(hp<=0){bossDefeated=true;score+=30;scoreEl.textContent=score;boss.classList.add('explode');setTimeout(()=>boss.remove(),700)}})}}function spawn(){if(!running||paused)return;const m=document.createElement('div');m.className='monster '+roundType+(Date.now()<doubleUntil?' double-active':'');m.style.setProperty('--body',colors[Math.floor(Math.random()*colors.length)]);m.innerHTML='<span class="double-tag">×2</span><i class="horn left"></i><i class="horn right"></i><i class="eye one"></i><i class="eye two"></i><i class="mouth"></i>';const y=20+Math.random()*Math.max(60,game.clientHeight-150),left=Math.random()>.5,d=left?1:-1,w=Math.random()*6.28;let x=left?-150:innerWidth+30,s=2.1+Math.random()*2.2;if(roundType==='orb')s=5.5+Math.random()*2.8;if(roundType==='alien')s=3.4+Math.random()*2.1;m.style.top=y+'px';m.style.left=x+'px';game.append(m);const fly=setInterval(()=>{if(paused)return;x+=d*s;let off=Math.sin(x/45+w)*28;if(roundType==='alien')off=Math.round(Math.sin(x/19+w)*4)*10;if(roundType==='ufo')off=Math.sin(x/30+w)*18;m.style.left=x+'px';m.style.top=(y+off)+'px';if(x<-180||x>innerWidth+180){clearInterval(fly);m.remove()}},16);m.addEventListener('pointerdown',e=>{if(paused)return;e.stopPropagation();clearInterval(fly);score+=Date.now()<doubleUntil?2:1;scoreEl.textContent=score;maybeSpawnBoss();laser();const b=document.createElement('div'),r=game.getBoundingClientRect();b.className='pop';b.style.left=(e.clientX-r.left)+'px';b.style.top=(e.clientY-r.top)+'px';game.append(b);m.remove();setTimeout(()=>b.remove(),400)})}
function setDoubleTags(active){document.querySelectorAll('.monster').forEach(m=>m.classList.toggle('double-active',active))}function activateDouble(){doubleUntil=Date.now()+5000;setDoubleTags(true);clearInterval(bonusTimer);bonusTimer=setInterval(()=>{const remaining=Math.max(0,Math.ceil((doubleUntil-Date.now())/1000));bonusEl.textContent=remaining?remaining+'s':'—';if(!remaining){clearInterval(bonusTimer);setDoubleTags(false)}},100)}function spawnPower(){if(!running||paused)return;const p=document.createElement('div');p.className='powerup';const y=20+Math.random()*Math.max(60,game.clientHeight-100),left=Math.random()>.5,d=left?1:-1;let x=left?-70:innerWidth+30,s=1.6+Math.random()*1.4;p.style.top=y+'px';p.style.left=x+'px';game.append(p);const fly=setInterval(()=>{if(paused)return;x+=d*s;p.style.left=x+'px';if(x<-80||x>innerWidth+80){clearInterval(fly);p.remove()}},16);p.addEventListener('pointerdown',e=>{if(paused)return;e.stopPropagation();clearInterval(fly);activateDouble();const r=game.getBoundingClientRect(),burst=document.createElement('div');burst.className='shatter';burst.style.left=(e.clientX-r.left)+'px';burst.style.top=(e.clientY-r.top)+'px';burst.innerHTML='<i class="shard"></i><i class="shard"></i><i class="shard"></i><i class="shard"></i><i class="shard"></i><i class="shard"></i>';game.append(burst);p.remove();setTimeout(()=>burst.remove(),550)})}
function spawnMeteor(side){if(!running||paused)return;const meteor=document.createElement('div'),width=game.clientWidth,height=game.clientHeight,edge=55,targetX=width*.2+Math.random()*width*.6,targetY=height*(.3+Math.random()*.35);let startX,startY;switch(side){case'top':startX=Math.random()*width;startY=-edge;break;case'right':startX=width+edge;startY=Math.random()*height;break;case'left':startX=-edge;startY=Math.random()*height;break;default:startX=Math.random()*width;startY=height+edge}const angle=Math.atan2(targetY-startY,targetX-startX)*180/Math.PI;let progress=0;meteor.className='meteor';meteor.style.left=startX+'px';meteor.style.top=startY+'px';meteor.style.transform='rotate('+angle+'deg)';game.append(meteor);const fly=setInterval(()=>{if(paused)return;progress+=.025;const ease=1-Math.pow(1-progress,2);meteor.style.left=(startX+(targetX-startX)*ease)+'px';meteor.style.top=(startY+(targetY-startY)*ease)+'px';if(progress>=1){clearInterval(fly);meteor.remove()}},16)}function meteorWave(){const sides=['top','right','bottom','left',['top','right','bottom','left'][Math.floor(Math.random()*4)]];sides.forEach((side,index)=>setTimeout(()=>spawnMeteor(side),index*90))}
function begin(){score=0;seconds=45;paused=false;bossSpawned=false;bossDefeated=false;doubleUntil=0;clearInterval(bonusTimer);bonusEl.textContent='—';roundType=selected;scoreEl.textContent=score;timeEl.textContent=seconds;running=true;start.style.display='none';updateShop();updateWorlds();updateControls();startMusic();spawn();spawner=setInterval(spawn,780);powerSpawner=setInterval(spawnPower,6000);meteorSpawner=setInterval(meteorWave,5000);setTimeout(spawnPower,3000);timer=setInterval(()=>{if(paused)return;timeEl.textContent=--seconds;if(seconds<=0)end()},1000)}function end(){running=false;paused=false;doubleUntil=0;clearInterval(timer);clearInterval(spawner);clearInterval(powerSpawner);clearInterval(meteorSpawner);clearInterval(bonusTimer);stopMusic();bonusEl.textContent='—';document.querySelectorAll('.monster,.powerup,.boss,.meteor').forEach(x=>x.remove());const all=save(player,score),total=all.find(x=>x.id===player.toLocaleLowerCase()).points;card.innerHTML='<h1>'+score+' PUNKTE!</h1><p><b>'+esc(player)+'</b>, deine Punkte wurden gespeichert.<br>Gesamt: <b>'+total+'</b></p><div class="leaderboard"><h2>TOP 10 · GESAMTPUNKTE</h2><ol>'+list(all)+'</ol></div><p><button id="again">NOCHMAL SPIELEN</button></p>';start.style.display='grid';updateShop();updateWorlds();updateControls();document.querySelector('#again').addEventListener('click',begin)}
document.querySelectorAll('.shop-item').forEach(item=>{const type=item.dataset.type;item.querySelector('.choose').addEventListener('click',()=>{if(unlocked(type)){selected=type;updateShop()}});item.querySelector('.unlock')?.addEventListener('click',()=>buy(type))});document.querySelectorAll('.world-button').forEach(button=>button.addEventListener('click',()=>{const type=button.dataset.world;if(worldUnlocked(type))setWorld(type);else buyWorld(type)}));pauseButton.addEventListener('click',()=>{paused=true;stopMusic();updateControls()});resumeButton.addEventListener('click',()=>{paused=false;startMusic();updateControls()});game.addEventListener('pointermove',e=>{const r=game.getBoundingClientRect();crosshair.style.left=(e.clientX-r.left)+'px';crosshair.style.top=(e.clientY-r.top)+'px'});showStart();refreshLeaderboard();updateControls();
</script></body></html>
