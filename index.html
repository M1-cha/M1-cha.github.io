const game=document.querySelector('#game'),scoreEl=document.querySelector('#score'),timeEl=document.querySelector('#time'),bonusEl=document.querySelector('#bonus'),start=document.querySelector('#start'),card=document.querySelector('#card'),crosshair=document.querySelector('#crosshair'),pauseButton=document.querySelector('#pause'),resumeButton=document.querySelector('#resume'),colors=['#ff6b91','#77d8ff','#9af27a','#ffbd59','#bd8cff'],key='galaxy-monsters-players',costs={classic:0,ufo:150,orb:275,alien:400},worldOrder=['one','two','three','four','five','six','seven','eight','nine'],worldNames={one:'Planeten',two:'Galaxie',three:'Jupiter Galaxy',four:'Mond',five:'Mars',six:'Jupiter',seven:'Uranus',eight:'Saturn',nine:'Erde'};let score=0,seconds=45,running=false,paused=false,bossSpawned=false,bossDefeated=false,timer,spawner,powerSpawner,meteorSpawner,bonusTimer,musicTimer,upgradeTimer,upgradeHideTimer,musicIndex=0,doubleUntil=0,tripleUntil=0,audio,selected='classic',roundType='classic',world='one',player='';

let introPlaying=false;
document.addEventListener('submit',event=>{
 if(event.target.id!=='player-form')return;
 event.preventDefault();event.stopImmediatePropagation();
 if(introPlaying||running)return;
 const input=event.target.querySelector('#player');player=input.value.trim();if(!player){input.focus();return}
 introPlaying=true;
 const overlay=document.createElement('section'),video=document.createElement('video'),skip=document.createElement('button');
 const labels={de:['Intro überspringen','Intro abspielen'],en:['Skip intro','Play intro'],fr:['Passer l’intro','Lire l’intro'],it:['Salta intro','Riproduci intro'],es:['Saltar intro','Reproducir intro'],ru:['Пропустить заставку','Воспроизвести заставку'],zh:['跳过片头','播放片头'],ja:['イントロをスキップ','イントロを再生']}[currentLanguage];
 overlay.id='intro-screen';overlay.setAttribute('role','dialog');overlay.setAttribute('aria-modal','true');overlay.setAttribute('aria-label','Galaxy and Monsters — Intro');
 video.src='game-intro.mp4';video.playsInline=true;video.preload='auto';
 skip.type='button';skip.textContent=labels[0];
 let finished=false;

 skip.addEventListener('click',finish);video.addEventListener('ended',finish);video.addEventListener('error',finish);
 const info=document.createElement('div');info.className='intro-info';
 const introText=document.createElement('p');introText.textContent='Trete ein in die Welt der Aliens, du verlierst regelmäßig Lebenspunkte, fülle sie mit den umherschwebenden Tränken auf. Wähle ein beliebiges Alien und Welt aus. Und knacke den Highscore. Viel Spaß!';

 const licenses=document.createElement('section');licenses.className='intro-licenses';
 const licenseTitle=document.createElement('h2');licenseTitle.textContent='Lizenzen der Bilder';
 const licenseLinks=document.createElement('div');licenseLinks.className='intro-license-links';
 const imageLicenses=[['Glibbo','https://www.vecteezy.com/members/vector_townz'],['Lebensbalken','https://www.vecteezy.com/members/vector_townz'],['Endgegner-Alien','https://www.vecteezy.com/members/vitamincm'],['Lycee Chee','https://lyceechee.myportfolio.com/'],['Zorblax','https://www.vecteezy.com/members/amalialuri19948857']];
 imageLicenses.forEach(([label,url])=>{const link=document.createElement('a');link.textContent=label;link.href=url;link.target='_blank';link.rel='noopener noreferrer';link.title=label+' – in neuem Tab öffnen';licenseLinks.append(link)});
 licenses.append(licenseTitle,licenseLinks);info.append(licenses);
 const introContent=document.createElement('div');introContent.className='intro-content';

 overlay.append(video,introContent,skip);document.body.append(overlay);skip.focus();
 overlay.addEventListener('keydown',event=>{if(event.key==='Escape'){event.preventDefault();finish()}if(event.key==='Tab'){const controls=[...overlay.querySelectorAll('button,a[href]')];event.preventDefault();const index=controls.indexOf(document.activeElement),step=event.shiftKey?-1:1;controls[(index+step+controls.length)%controls.length].focus()}});
 video.play().catch(()=>{if(finished)return;const play=document.createElement('button');play.type='button';play.className='intro-play';play.textContent=labels[1];play.addEventListener('click',()=>video.play().then(()=>play.remove()).catch(()=>{}));overlay.append(play)});
},true);

new MutationObserver(records=>records.forEach(record=>record.addedNodes.forEach(node=>{if(node.nodeType===1&&node.classList.contains('monster')){const type=['classic','ufo','orb','alien'].find(name=>node.classList.contains(name));if(type){node.classList.add('alien-art');node.style.backgroundImage=`url('${alienArtByType[type]}')`}}}))).observe(game,{childList:true});
